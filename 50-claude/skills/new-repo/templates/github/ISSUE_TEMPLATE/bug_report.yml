name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A vulnerability goes through SECURITY.md, never in a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got. Paste the full error.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. <command>
        2. <command>
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the output of `git rev-parse --short HEAD` in your clone.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: tools
    attributes:
      label: Tool versions
      description: The output of <the version commands of the tools it needs>.
