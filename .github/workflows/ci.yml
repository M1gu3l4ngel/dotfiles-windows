# Runs tools/check.ps1, the same checks as a local run, on every push to main and every pull
# request. A Windows runner, because the scripts target PowerShell 5.1 and 7; node already comes
# with windows-latest. The result shows as a check next to each commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# Saves Actions minutes: a new push cancels the previous run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA: a tag can be moved to other code.
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: gitleaks scans every commit
          persist-credentials: false

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      # gitleaks is not on the runner: it is downloaded at a pinned version and its SHA-256 is
      # verified before use. It goes to the runner's temp folder, outside the repo: the zip has a
      # README.md, and inside the repo the bilingual docs check would take it for a document with
      # no Spanish pair.
      - name: Install gitleaks
        shell: pwsh
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e"
        run: |
          $url = "https://github.com/gitleaks/gitleaks/releases/download/v${env:GITLEAKS_VERSION}/gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $bin = Join-Path $env:RUNNER_TEMP 'gitleaks-bin'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:GITLEAKS_SHA256) { throw "gitleaks SHA-256 does not match" }
          Expand-Archive -Path $zip -DestinationPath $bin -Force
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Run the checks
        shell: pwsh
        run: .\tools\check.ps1
